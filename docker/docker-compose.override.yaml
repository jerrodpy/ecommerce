services:
  mysql:
    ports:
      - "${MYSQL_PORT}:3306"

  nginx:
    ports:
      - "${NGINX_PORT}:8080"

  php-fpm:
    build:
      context: ./php-fpm
      args:
        ENABLE_XDEBUG: "true"
    environment:
      - PHP_IDE_CONFIG=serverName=Docker
      - XDEBUG_CONFIG=${XDEBUG_CONFIG}
    expose:
      - "9000"

  redis:
    ports:
      - "${REDIS_PORT}:6379"
