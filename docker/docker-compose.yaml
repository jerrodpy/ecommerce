networks:
  ecommerce:

volumes:
  ecommerce-mysql-volume:

services:
    mysql:
      build:
        context: ./mysql
      container_name: "${COMPOSE_PROJECT_NAME}-mysql"
      environment:
        - MYSQL_USER=laravel
        - MYSQL_PASSWORD=${MYSQL_PASSWORD:-laravel}
        - MYSQL_ROOT_PASSWORD=${MYSQL_ROOT_PASSWORD:-root}
      volumes:
        - ./mysql/databases.sql:/docker-entrypoint-initdb.d/databases.sql
        - ecommerce-mysql-volume:/var/lib/mysql
      networks:
        - ecommerce

    nginx:
      build:
        context: ./nginx
        args:
          PHP_UPSTREAM_CONTAINER: "${COMPOSE_PROJECT_NAME}-php-fpm"
      container_name: "${COMPOSE_PROJECT_NAME}-nginx"
      volumes:
        - ../backend:/var/www
        - ./logs/nginx/:/var/log/nginx
        - ./nginx/sites/:/etc/nginx/sites-available
      depends_on:
        - php-fpm
      ports:
        - "${NGINX_PORT}:8080"
      networks:
        - ecommerce

    php-fpm:
      build:
        context: ./php-fpm
        args:
          USER_ID: ${USER_ID:-1000}
          GROUP_ID: ${GROUP_ID:-1000}
      container_name: "${COMPOSE_PROJECT_NAME}-php-fpm"
      command: php-fpm
      volumes:
        - ../backend:/var/www:cached
      networks:
        - ecommerce
      depends_on:
        mysql:
          condition: service_started
        redis:
          condition: service_healthy
      healthcheck:
        test: ["CMD-SHELL", "pidof php-fpm"]
        interval: 10s
        timeout: 5s
        retries: 3
        start_period: 30s

    node:
      build:
        context: ./node
      container_name: "${COMPOSE_PROJECT_NAME}-node"
      depends_on:
        redis:
          condition: service_healthy
      working_dir: /var/www/html/frontend
      volumes:
        - ./../frontend:/var/www/html/frontend
      ports:
        - "5173:5173" # Vite dev server
        - "13714:13714" # Vite HMR
        - "8082:8080"
        - "3002:3000"
      environment:
        - NODE_ENV=development
        - REDIS_HOST=redis
        - REDIS_PORT=6379
        - REDIS_PASSWORD=${REDIS_PASSWORD}
      command: sh -c "cd /var/www/html/frontend && npm install && npm run dev -- --host 0.0.0.0"
      networks:
        - ecommerce
      stdin_open: true
      tty: true

    redis:
      container_name: "${COMPOSE_PROJECT_NAME}-redis"
      image: 'redis:3.2.6-alpine'
      environment:
        - REDIS_PASSWORD=${REDIS_PASSWORD}
      command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}"]
      healthcheck:
        test: ["CMD-SHELL", "redis-cli -a $$REDIS_PASSWORD ping || exit 1"]
        interval: 5s
        timeout: 5s
        retries: 5
        start_period: 30s
      networks:
        - ecommerce
